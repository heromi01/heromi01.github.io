<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>방명록 | heromi01</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="guestbook.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .container {
      max-width: 720px;
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 40px 36px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      animation: fadeIn 0.8s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .top-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      background: rgba(255, 255, 255, 0.08);
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .btn-back:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: translateX(-2px);
    }

    .page-title {
      font-size: 1.8rem;
      font-weight: 800;
      margin-bottom: 8px;
      background: linear-gradient(to right, #ffffff, #c7d2fe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .page-subtitle {
      font-size: 0.95rem;
      color: #94a3b8;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    footer {
      margin-top: 36px;
      text-align: center;
      font-size: 0.8rem;
      color: #475569;
    }

    @media (max-width: 600px) {
      body {
        padding: 20px 12px;
      }
      .container {
        padding: 28px 18px;
      }
      .page-title {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="top-nav">
      <a href="index.html" class="btn-back">
        ← 홈으로 돌아가기
      </a>
      <span style="font-size: 0.82rem; color: #64748b;">heromi01.github.io</span>
    </div>

    <h1 class="page-title">💬 방명록 (Guestbook)</h1>
    <p class="page-subtitle">
      방문해 주셔서 감사합니다! 자유롭게 발자국과 따뜻한 메시지를 남겨주세요.
    </p>

    <!-- Guestbook Component Section -->
    <section id="guestbook" class="guestbook-section" style="margin-top: 0; padding-top: 0; border-top: none;">
      <div class="guestbook-header">
        <h2 class="guestbook-title" style="font-size: 1.2rem;">
          <span>남겨진 이야기</span>
          <span id="guestbook-count" class="guestbook-count-badge">0개</span>
        </h2>
      </div>

      <!-- Guestbook Form -->
      <form id="guestbook-form" class="guestbook-form">
        <div class="form-row">
          <div class="input-group">
            <label for="author-input">작성자 닉네임 *</label>
            <input
              type="text"
              id="author-input"
              maxlength="15"
              placeholder="예: 멋진개발자"
              required
            />
          </div>
          <div class="input-group">
            <label for="password-input">삭제 비밀번호 *</label>
            <input
              type="password"
              id="password-input"
              maxlength="20"
              placeholder="삭제 시 필요한 비밀번호"
              required
            />
          </div>
        </div>

        <div class="input-group">
          <label for="content-input">방명록 내용 *</label>
          <textarea
            id="content-input"
            rows="3"
            maxlength="500"
            placeholder="따뜻한 응원이나 인사말을 자유롭게 남겨주세요 :)"
            required
          ></textarea>
        </div>

        <div class="form-footer">
          <div class="form-tip">
            <span>🔑</span>
            <span>관리자 마스터 비밀번호: <code>0000</code></span>
          </div>
          <button type="submit" class="btn-submit">
            <span>✏️ 방명록 기록하기</span>
          </button>
        </div>
      </form>

      <!-- Guestbook Entries List -->
      <div id="guestbook-list" class="guestbook-list">
        <!-- Rendered dynamically by guestbook.js -->
      </div>
    </section>

    <footer>
      © 2026 heromi01. Powered by GitHub Pages.
    </footer>
  </main>

  <!-- Modal 1: 기록 완료 알림 창 (Dedicated Success Modal) -->
  <div id="success-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="success-title">
    <div class="modal-window">
      <div class="modal-icon success">
        ✓
      </div>
      <h3 id="success-title" class="modal-title">기록 완료!</h3>
      <p class="modal-desc">
        소중한 방명록이 성공적으로 등록되었습니다. 🎉
      </p>

      <div class="modal-preview">
        <div class="preview-author">
          <span id="success-modal-author">작성자</span>
          <span id="success-modal-time" class="preview-time">방금 전</span>
        </div>
        <div id="success-modal-content" class="preview-content">
          방명록 내용 미리보기
        </div>
      </div>

      <div class="modal-actions">
        <button type="button" id="btn-success-confirm" class="btn-modal btn-modal-primary">
          확인
        </button>
      </div>
    </div>
  </div>

  <!-- Modal 2: 삭제 확인 창 (Delete Modal with Master Password) -->
  <div id="delete-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="delete-title">
    <div class="modal-window">
      <div class="modal-icon danger">
        🗑️
      </div>
      <h3 id="delete-title" class="modal-title">방명록 삭제</h3>
      <p class="modal-desc">
        작성 시 입력한 <strong>비밀번호</strong>를 입력해주세요.<br>
        <span style="font-size: 0.8rem; color: #a5b4fc;">(마스터 비밀번호 <code>0000</code> 입력 시 즉시 삭제 가능)</span>
      </p>

      <input
        type="password"
        id="delete-password-input"
        class="modal-input"
        placeholder="비밀번호 입력"
        maxlength="20"
        autocomplete="off"
      />

      <div id="delete-error-msg" class="modal-error-msg"></div>

      <div class="modal-actions">
        <button type="button" id="btn-delete-cancel" class="btn-modal btn-modal-cancel">
          취소
        </button>
        <button type="button" id="btn-delete-confirm" class="btn-modal btn-modal-danger">
          삭제하기
        </button>
      </div>
    </div>
  </div>

  <script src="guestbook.js"></script>
</body>
</html>
